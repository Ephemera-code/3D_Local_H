[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

# 🔀 Rewrite SPA: sin esto, recargar la página en una ruta como /galeria
# (o compartir ese link directo) da 404 — Netlify busca un archivo físico
# en esa ruta y no lo encuentra, ya que React Router maneja esas rutas del
# lado del cliente, no como archivos reales.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200